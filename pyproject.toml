[project]
name = "crb"
version = "0.0.0"
description = "CRB (ClassRoom Booking) — 南京大学教室借用自动化 CLI + Skill"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CRB Contributors" }]
keywords = ["nju", "classroom", "booking", "cli", "skill", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# 扫码/有头登录需要 Playwright（首次使用需 `playwright install chromium`）
login = ["playwright>=1.44"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
crb = "crb.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# sdist 里额外带上测试 / 脚本 / 示例 / 文档与发布物料，方便从源码构建与审阅。
source-include = [
    "tests/**",
    "scripts/**",
    "examples/**",
    "docs/**",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：typer/click 的推荐写法就是在默认值里调用 Option，无需规避
ignore = ["E501", "B008"]
